name: qualtive
description: Flutter client for Qualtive. Fetch enquiries and post feedback with scores, text, users, and attachments on iOS and Android.
version: 0.0.2
homepage: https://qualtive.io
repository: https://github.com/nightshift-habits/qualtive-client-flutter
issue_tracker: https://github.com/nightshift-habits/qualtive-client-flutter/issues

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.qualtive.qualtive
        pluginClass: QualtivePlugin
      ios:
        pluginClass: QualtivePlugin
        sharedDarwinSource: true
