name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: qualtive
        run: flutter pub get
      - name: Analyze
        working-directory: qualtive
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: qualtive
        run: flutter test
      - name: Downgrade dependencies
        working-directory: qualtive
        run: flutter pub downgrade
      - name: Analyze downgraded
        working-directory: qualtive
        run: dart analyze --fatal-infos
      - name: Test downgraded
        working-directory: qualtive
        run: flutter test
      - name: Restore dependencies
        working-directory: qualtive
        run: flutter pub upgrade
      - name: Get example dependencies
        working-directory: qualtive/example
        run: flutter pub get
      - name: Analyze example
        working-directory: qualtive/example
        run: dart analyze --fatal-infos
      - name: Test example
        working-directory: qualtive/example
        run: flutter test
