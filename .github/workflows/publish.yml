name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Publish to pub.dev
        working-directory: qualtive
        run: dart pub publish --force
